
  <div class="container-fluid">
  <form [formGroup]="reportForm" (ngSubmit)="submitForm()">
    <div class="row">
      <div class="col-md-6">
        <div class="form-group">
          <label for="title">{{ "title" | translate }}</label>
          <input type="text" formControlName="title" class="form-control" autocomplete="false" />
        </div>
      </div>
      <div class="col-md-12">
        <div class="row">
          <div class="col-md-6">
            <div class="form-group d-flex align-items-center">
              <label for="period" class="mr-2">{{ "period" | translate }}</label>
              <mat-form-field appearance="outline" class="flex-grow-1">
                <mat-select formControlName="period" class="form-control" placeholder="Nothing selected" (selectionChange)="periodChanged()">
                  <mat-option></mat-option>
                  <mat-option *ngFor="let data of period" [value]="data">
                    {{ data }}
                  </mat-option>
                </mat-select>
              </mat-form-field>
              
            </div>
          </div>
         
        </div>
      </div>
      <div class="col-md-12">
        <div class="form-group d-flex align-items-center">
          <label for="dateFrom" class="control-label">Date from</label>
          <div class="col-sm-5 d-flex">
            <mat-form-field appearance="fill" class="form-calendar form-control">
                <input matInput [matDatepicker]="startDatePicker" formControlName="dateFrom" />
                <mat-datepicker-toggle matIconSuffix [for]="startDatePicker"></mat-datepicker-toggle>
                <mat-datepicker #startDatePicker></mat-datepicker>
             </mat-form-field>
            <select formControlName="fromTime" class="form-control">
              <option *ngFor="let time of times" [value]="time">{{ time }}</option>
            </select>
          </div>
        </div>
      <!-- </div>
      <div class="col-md-12"> -->
        <div class="form-group">
          <label for="dateTo" class="control-label">Date to</label>
          <div class="col-sm-5 d-flex">
            <mat-form-field appearance="fill" class="form-calendar form-control">
                <input matInput [matDatepicker]="startDatePicker" formControlName="dateTo" />
                <mat-datepicker-toggle matIconSuffix [for]="startDatePicker"></mat-datepicker-toggle>
                <mat-datepicker #startDatePicker></mat-datepicker>
            </mat-form-field>
            <select formControlName="toTime" class="form-control">
              <option *ngFor="let time of times" [value]="time">{{ time }}</option>
            </select>
          </div>
        </div>
      </div>
    </div>
    <div class="col-md-6">
        <div class="form-group d-flex align-items-center">
          <label for="device" class="mr-2">{{ "devices" | translate }}</label>
          <mat-form-field appearance="outline" class="flex-grow-1">
            <mat-select multiple formControlName="device" placeholder="Choose devices" class="form-control">
                <mat-option (click)="toggleSelectAll()" [value]="null">
                    {{ isAllSelected() ? 'Deselect All' : 'Select All' }}
                  </mat-option>
              <mat-option *ngFor="let device of devices" [value]="device.id">
                {{ device.name }}
              </mat-option>
            </mat-select>
          </mat-form-field>
        </div>
        <div *ngIf="reportForm?.get('device')?.hasError('required') && reportForm?.get('device')?.touched">
          <span class="error-message">Please select a device</span>
        </div>
      </div>
      <div class="col-md-6">
        <div class="form-group d-flex align-items-center">
          <label for="pois" class="mr-2">{{ "pois" | translate }}</label>
          <mat-form-field appearance="outline" class="flex-grow-1">
            <mat-select multiple formControlName="pois" placeholder="Choose pois" class="form-control">
              <!-- <mat-option (click)="selectAllPois()" [value]="null">
                Select All
              </mat-option>
              <mat-option (click)="deselectAllPois()" [value]="null">
                Deselect All
              </mat-option> -->
              <mat-option (click)="toggleSelectAllPois()" [value]="null">
                {{ isAllSelectedPois() ? 'Deselect All' : 'Select All' }}
              </mat-option>
              
              <mat-option *ngFor="let poi of poisList" [value]="poi.poi_id">
                {{ poi.name }}
              </mat-option>
              
            </mat-select>
          </mat-form-field>
        </div>
        <div *ngIf="reportForm?.get('pois')?.hasError('required') && reportForm?.get('pois')?.touched">
          <span class="error-message">Please select a pois</span>
        </div>
      </div>
      
      <div class="row">
        <div class="col-md-12">
          <button class="btn btn-primary btn-lg" type="submit">Generate</button>
        </div>
      </div>
  </form>
</div>
